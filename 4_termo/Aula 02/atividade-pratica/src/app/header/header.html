<header class="sticky top-0 z-50 w-full bg-stone-100 px-6 py-3 shadow-sm">
  <nav class="mx-auto flex max-w-7xl items-center justify-between" aria-label="Navegação Principal">
    
    <div class="flex lg:flex-1">
      <a href="#" class="-m-1.5 p-1.5 text-lg font-bold text-gray-900 hover:text-gray-700 transition-colors">
        Marca
      </a>
    </div>

    <!--LINKS -->
    <div class="hidden lg:flex lg:gap-x-8">
      @for (item of navItems; track item.label) {
        <a [href]="item.path" class="text-sm font-semibold text-gray-600 hover:text-gray-900 transition-colors">
          {{ item.label }}
        </a>
      }
    </div>

    <div class="hidden lg:flex lg:flex-1 lg:justify-end">
      <a href="#" class="text-sm font-semibold text-gray-600 hover:text-gray-900 transition-colors">
        Entrar <span aria-hidden="true"></span>
      </a>
    </div>
  </nav>

</header>
