<section class=" flex w-full bg-[#afb000] py-16 px-6 rounded-xl  text-center border border-black">
  <div class="flex flex-col justify-begin align-begin items-start">
    
    <h1 class="text-3xl text-left sm:text-5xl font-bold tracking-tight">
      {{ title }}
    </h1>
    <p class="mt-4 text-base text-left sm:text-lg opacity-80">
      {{ subtitle }}
    </p>

    <div class="mt-8">
      <a
        [href]="primaryCtaLink"
        class="inline-block rounded-lg bg-indigo-600 px-6 py-3 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors"
      >
        {{ primaryCtaText }}
      </a>
    </div>

  </div>
</section>
