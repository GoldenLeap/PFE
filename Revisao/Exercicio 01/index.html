<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Sensores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <img src="https://placehold.co/200x40" alt="Logo">
            <h1>Dashboard</h1>
        </div>
        <div class="connection-status">
            <div class="dot ok"></div>
            <span>Online</span>
        </div>
    </header>

    <main>
        <section class="filter">
            <button id="reload">Atualizar dados</button>
            <label for="filter-type">Filtrar por tipo:</label>
            <select id="filter-type">
                <option value="Todos">Todos</option>
                <option value="Temperatura">Temperatura</option>
                <option value="Umidade">Umidade</option>
                <option value="Pressão">Pressão</option>
            </select>
        </section>

        <section class="grid-cards" id="card-board">
            <!--  cards  injetados dinamicamente pelo Javascript -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Todos os direitos reservados.</p>
        <p>Última atualização: <span id="last-update">-</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
