<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisao 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="https://placehold.co/200x40" alt="Logo">
        <h1>Titulo Dashboard</h1>
        <div class='dot ok'></div>
    </header>
    <main>
        <section class="filter">
            <button id="reload">Atualizar dados</button>
            <p>Filtrar por tipo</p>
            <select name="" id="">
                <option value="">Temperatura</option>
                <option value="">Umidade</option>
                <option value="">Pressão</option>
            </select>
        </section>
        <section class="grid-cards" id="card-board">
            <div class="card">
                <h3 id="nome">Nome</h3>
                <p id="val">Data:</p>
                <p id="data">Num</p>
                <div class="status_sensor">
                    <div class="dot ok"></div><span>Status sensor</span>
                </div>
            </div>
        </section>
    </main>
    <footer>&copy;2026 todos os direitos reservados</footer>
    <script src="script.js"></script>
</body>
</html>
